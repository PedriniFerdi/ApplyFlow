spring:
  application:
    name: applyflow-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:applyflow}
    username: ${DB_USERNAME:applyflow}
    password: ${DB_PASSWORD:applyflow}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql
  session:
    timeout: ${SESSION_TIMEOUT:12h}
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 * * * * *"
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope: openid,email,profile
            redirect-uri: ${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${MAIL_READ_TIMEOUT_MS:5000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:5000}
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: APPLYFLOW_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGIN:http://localhost:5173}}
  frontend-url: ${FRONTEND_APP_URL:http://localhost:5173}
  mail:
    delivery-enabled: ${MAIL_DELIVERY_ENABLED:false}
    from: ${MAIL_FROM:no-reply@applyflow.local}
    outbox:
      scheduling-enabled: ${MAIL_OUTBOX_SCHEDULING_ENABLED:true}
      retry-interval: ${MAIL_OUTBOX_RETRY_INTERVAL:PT1M}
      claim-lease: ${MAIL_OUTBOX_CLAIM_LEASE:PT5M}
      encryption-key: ${OUTBOX_ENCRYPTION_KEY:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
  auth:
    verification-ttl: ${EMAIL_VERIFICATION_TTL:24h}
    password-token-ttl: ${PASSWORD_TOKEN_TTL:30m}
    token-cooldown: ${ACCOUNT_TOKEN_COOLDOWN:1m}
    remember-me: ${REMEMBER_ME_DURATION:30d}
  security:
    rate-limit:
      window: ${AUTH_RATE_LIMIT_WINDOW:PT15M}
      login-limit: ${AUTH_LOGIN_RATE_LIMIT:10}
      register-limit: ${AUTH_REGISTER_RATE_LIMIT:5}
      recovery-limit: ${AUTH_RECOVERY_RATE_LIMIT:5}
      reset-limit: ${AUTH_RESET_RATE_LIMIT:8}
      job-offer-extraction-limit: ${JOB_OFFER_EXTRACTION_RATE_LIMIT:20}
  job-offer-extraction:
    connect-timeout: ${JOB_OFFER_CONNECT_TIMEOUT:2s}
    read-timeout: ${JOB_OFFER_READ_TIMEOUT:3s}
    total-timeout: ${JOB_OFFER_TOTAL_TIMEOUT:5s}
    max-html-bytes: ${JOB_OFFER_MAX_HTML_BYTES:1048576}
    max-redirects: ${JOB_OFFER_MAX_REDIRECTS:3}
    max-concurrent: ${JOB_OFFER_MAX_CONCURRENT:8}
