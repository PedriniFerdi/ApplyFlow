name: Frontend CI

on:
  pull_request: {}
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/frontend-ci.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Run lint
        run: npm run lint

      - name: Validate browser environment allowlist
        run: npm run check:browser-env
        env:
          VITE_BACKEND_BASE_URL: https://applyflow-public-canary.invalid
          VITE_WU51_BLOCK_PROBE: controlled-red-proof

      - name: Build production bundle
        run: npm run build
        env:
          VITE_BACKEND_BASE_URL: https://applyflow-public-canary.invalid
          APPLYFLOW_PRIVATE_CANARY: applyflow-private-canary-must-not-ship

      - name: Verify production bundle secrecy
        run: npm run check:bundle-secrets
        env:
          VITE_BACKEND_BASE_URL: https://applyflow-public-canary.invalid
          APPLYFLOW_PRIVATE_CANARY: applyflow-private-canary-must-not-ship
