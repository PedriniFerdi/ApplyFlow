name: Feature request
description: Propose a focused product or contributor improvement.
title: "feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: Who is affected, when, and why does it matter?
    validations: {required: true}
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result.
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Outline a solution and important business rules.
    validations: {required: true}
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches or workarounds were evaluated?
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: Define the smallest useful slice and exclusions.
    validations: {required: true}
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List concrete, verifiable completion conditions.
    validations: {required: true}
  - type: textarea
    id: risks
    attributes:
      label: Risks and dependencies
      description: Note security, compatibility, migration, or delivery concerns.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched for similar requests.
          required: true
        - label: This request defines a user or contributor outcome.
          required: true
